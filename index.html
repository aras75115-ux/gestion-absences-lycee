<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appel Pro - Lycée EL HADRI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-5xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden">
        <div class="bg-indigo-900 p-6 text-white text-center">
            <h1 class="text-xl md:text-2xl font-bold uppercase tracking-widest leading-tight">Lycée EL HAJJ MOHAMED BEN HSSAIN EL HADRI</h1>
            <p class="text-indigo-300 mt-2 text-xs font-semibold uppercase tracking-tighter">Registre Numérique des Absences</p>
        </div>

        <div class="p-6">
            <div class="mb-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 bg-indigo-50 p-5 rounded-lg border border-indigo-100 shadow-sm">
                <div>
                    <label class="block text-[10px] font-black text-indigo-900 mb-1 uppercase">Date :</label>
                    <input type="date" id="date-select" onchange="changerContexte()" class="w-full p-2 rounded-md border-indigo-200 font-bold text-indigo-800 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-indigo-900 mb-1 uppercase">Classe :</label>
                    <select id="classe-select" onchange="changerContexte()" class="w-full p-2 rounded-md border-indigo-200 font-bold text-indigo-800 text-sm">
                        <option value="2 BAC SVT">2 BAC SVT</option>
                        <option value="2 BAC PC">2 BAC PC</option>
                        <option value="2BAC SPC FR">2BAC SPC FR</option>
                        <option value="1BAC SLH-3">1BAC SLH-3</option>
                        <option value="1BAC LSH-4">1BAC LSH-4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-indigo-900 mb-1 uppercase">Matière :</label>
                    <select id="matiere-select" onchange="changerContexte()" class="w-full p-2 rounded-md border-indigo-200 font-bold text-indigo-800 text-sm">
                        <option value="Français">Français</option>
                        <option value="Philosophie">Philosophie</option>
                        <option value="SVT">SVT</option>
                        <option value="Physique-Chimie">Physique-Chimie</option>
                        <option value="Mathématiques">Mathématiques</option>
                        <option value="Anglais">Anglais</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-indigo-900 mb-1 uppercase">Professeur :</label>
                    <select id="prof-select" onchange="changerContexte()" class="w-full p-2 rounded-md border-indigo-200 font-bold text-indigo-800 text-sm">
                        <option value="M. EL KHOUMSSI">M. EL KHOUMSSI</option>
                        <option value="M. Alami">M. Alami</option>
                        <option value="Mme. Bennani">Mme. Bennani</option>
                        <option value="Administration">Direction / Surveillance</option>
                    </select>
                </div>
            </div>

            <div class="mb-6 flex flex-wrap gap-2 justify-center">
                <span class="text-[10px] font-bold text-gray-400 w-full text-center mb-1 uppercase">Choisir la séance :</span>
                <select id="heure-select" onchange="changerContexte()" class="p-2 rounded-lg bg-white border border-gray-300 font-bold text-gray-700 text-sm shadow-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="08-09">08:00 - 09:00</option>
                    <option value="09-10">09:00 - 10:00</option>
                    <option value="10-11">10:00 - 11:00</option>
                    <option value="11-12">11:00 - 12:00</option>
                    <option value="14-15">14:00 - 15:00</option>
                    <option value="15-16">15:00 - 16:00</option>
                    <option value="16-17">16:00 - 17:00</option>
                    <option value="17-18">17:00 - 18:00</option>
                </select>
            </div>

            <div class="flex border-b border-gray-200 mb-4 no-print">
                <button id="tab-tout" onclick="setTab('tout')" class="py-2 px-6 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 transition-all">
                    📋 APPEL COMPLET
                </button>
                <button id="tab-absents" onclick="setTab('absents')" class="py-2 px-6 font-bold text-sm border-b-2 border-transparent text-gray-400 hover:text-red-500 transition-all">
                    🚫 LISTE DES ABSENTS
                </button>
            </div>

            <div class="flex justify-between items-center mb-4 border-b-2 border-indigo-100 pb-2">
                <h2 id="titre-liste" class="text-sm font-black text-indigo-900 uppercase">Liste nominative</h2>
                <div id="stats" class="text-white font-bold px-4 py-1 bg-indigo-600 rounded-full text-xs shadow-md"></div>
            </div>

            <div class="overflow-x-auto border rounded-xl shadow-inner bg-white">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-indigo-900 uppercase text-[10px] font-black tracking-widest">
                            <th class="py-4 px-6 border-b">Élève</th>
                            <th id="col-presence" class="py-4 px-6 text-center border-b">Présence</th>
                        </tr>
                    </thead>
                    <tbody id="student-list"></tbody>
                </table>
            </div>
            
            <div class="mt-8 pt-6 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                <button onclick="reinitialiser()" class="text-red-400 hover:text-red-600 text-xs font-bold uppercase tracking-widest transition-colors">
                    ⚠️ Vider cette séance
                </button>
                <button onclick="window.print()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-12 py-4 rounded-xl font-black shadow-2xl transition-all transform hover:scale-105 uppercase text-sm tracking-widest">
                    Imprimer le rapport d'appel
                </button>
            </div>
        </div>
    </div>

    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .shadow-2xl, .shadow-sm { box-shadow: none; border: 1px solid #eee; }
            .bg-indigo-900 { background-color: #1e1b4b !important; -webkit-print-color-adjust: exact; }
        }
    </style>

    <script>
        const donnéesClasses = {
            "2 BAC SVT": ["El Bouchibi Fatima", "Ez-Zaitouni Wiame", "Hammane Kaoutar", "El Mourabit Mohammed", "Esstitou Omar", "El Hadri Aya", "El Hadri Imane", "El Hadri Aymane", "El Mourabit Houdayfa", "Oudair Siham", "El Haddad Abdelaziz", "El Massari Ahlam", "El Mamoun Mohammed", "Yechou OLYA", "Es-Sebai Mounia", "El Mliles Hatim", "El younsi Doha", "El Meskini Yousra", "El Fayah Reda", "Nass Kassem Oussama", "ELladhi Safae", "Ramli Wafae", "El Mamouni Sajida"],
            "2 BAC PC": ["El Afia Safae", "ElLdhi Adnan", "El krioui Houdayfa", "Azzouz Mohammed", "Chaffani Rafida"],
            "2BAC SPC FR": ["El Massari Yaacoub", "El Assaoui Ouidad", "El Hammam Mohammed Anas", "El Faghloumi Mohammed Amine", "Abouali Nada", "El Faghloumi Yassir", "Doha El Rifi", "Merouane Oumaima", "Hanan Chafia", "Ajenoun Ech-Chaibi Adam", "El Mebless Safae", "Er-Rifi Islah", "El Amri Aya", "El Younsi Nada", "El Bakali Hafsa", "El Bakali Mohammed", "Zineb Er-Rafas", "Aalilou Ouidad", "El Belhaissani Adam", "El Afia Farah", "El Meskini Hidaya", "Ech-Chaibi Alae", "Douae Ben hssayne", "El Ghedouani Yahya"],
            "1BAC SLH-3": ["Ferbal Ayoub", "El Hadri Awatif", "El Khebat Mohammed", "Benerim Remissa", "El Ghoual Aya", "El Khebat Zaid", "Aârim Mohammed Yassine", "El Haddad Abdelkafi", "El Haddar Abderrahmane", "El Berremani Mohammed", "El Abdouni Manal", "El Hassini Douae", "El Jebbari Kholoud", "Ed-Derraz Fatima", "El Massari Mohammed", "Slimane El Abboudi", "Younes El Abboudi", "Ibrahim Wissal", "Oulad Hammidou Mohammed Ben Mohammed", "Aidoune Mohammed Reda", "El Jebbari Maryam", "El Abous Neamat", "Aârim Mohammed", "Kerbal Ahmed", "Aharmim Badr Eddine", "Aharmim Solimane Abdessalam", "Ahremim Fatima Zohra", "El Faghloumi Mohammed", "Oudaber Hafsa", "El Bezrani Mansour", "El Bounsi Nassira", "Boukhalef Aya Abdelaziz", "El Ladehi Mohammed Reda", "Ez-Zaitouni Mohammed", "El Bakali Et-Tahiri Aya", "El Younssfi Douae", "Aârim Rabie", "Es-Sellassi Wail", "El Mamoun Dina", "El Bakali Malak", "El Bakali Mouna", "Jebrone Youssef", "Ed-Derkaoui Younes"],
            "1BAC LSH-4": ["chouli Mohammed", "Ez-Zaitouni Mohammed", "Stitou Halima", "El Faghloumi Abdelmounaim", "El Aissaoui Mohammed", "El Khayat Mohammed Abdelkhalek", "Ed-Derraz Zineb", "El Jebbari Khadija", "Tohouach Solimane", "El Khayat Marouane", "Ez-Zerhouni Nihad", "El Khayat Rayane", "El Meskini Sabah", "Ajan Ferdaws", "El Mourabit Ihssane", "El Mourabit Hasnaa", "El Haddad Kaoutar", "Mohammed Ali Ez-Zaitouni", "El Amrani Mohammed", "El Kharboufi Mohammed", "El Jebbari Ferdaws", "Safae Ibn Ihssane", "Ferbal Badr Eddine", "El Hajjam Mohammed", "Esh-Shouni Aya", "El Assaoui Dalal", "El Khebat Mohammed Said", "El Haddad Siham", "El Mourabit Awatif", "Es-Sbino Salma", "Ed-Derraz Khawla", "Oudaber Salah Eddine", "El Khebat Adam", "Ajenoun Ech-Chaibi Imane", "Rami Mohammed Amine", "Ed-Derfaoui Mohammed Sami", "Maouloud Yassine", "Dandan Youssef", "Adrebouch Mohammed", "El Kraymi Yassine", "Ed-Derfaoui Alae"]
        };

        let absences = JSON.parse(localStorage.getItem("absences_v4_hadri")) || {};
        let ongletActif = "tout";

        function init() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date-select').value = today;
            changerContexte();
        }

        function setTab(type) {
            ongletActif = type;
            const btnTout = document.getElementById('tab-tout');
            const btnAbsents = document.getElementById('tab-absents');
            
            if(type === 'tout') {
                btnTout.className = "py-2 px-6 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 transition-all";
                btnAbsents.className = "py-2 px-6 font-bold text-sm border-b-2 border-transparent text-gray-400 hover:text-red-500 transition-all";
                document.getElementById('col-presence').style.display = "table-cell";
                document.getElementById('titre-liste').innerText = "Liste nominative";
            } else {
                btnAbsents.className = "py-2 px-6 font-bold text-sm border-b-2 border-red-500 text-red-500 transition-all";
                btnTout.className = "py-2 px-6 font-bold text-sm border-b-2 border-transparent text-gray-400 hover:text-indigo-600 transition-all";
                document.getElementById('col-presence').style.display = "none";
                document.getElementById('titre-liste').innerText = "Uniquement les absents";
            }
            changerContexte();
        }

        function changerContexte() {
            const date = document.getElementById('date-select').value;
            const classe = document.getElementById('classe-select').value;
            const heure = document.getElementById('heure-select').value;
            const matiere = document.getElementById('matiere-select').value;
            const idSession = `${date}_${classe}_${heure}_${matiere}`;

            const listeCorps = document.getElementById('student-list');
            listeCorps.innerHTML = "";

            donnéesClasses[classe].forEach(nom => {
                const estAbsent = absences[idSession] && absences[idSession].includes(nom);
                
                // Si l'onglet "absents" est actif, on n'affiche que ceux qui sont absents
                if (ongletActif === 'absents' && !estAbsent) return;

                const ligne = `
                    <tr class="border-b hover:bg-indigo-50 transition-colors">
                        <td class="py-4 px-6 font-medium text-gray-800 text-sm">${nom}</td>
                        <td class="py-4 px-6 text-center" style="${ongletActif === 'absents' ? 'display:none' : ''}">
                            <button onclick="toggleAbsence(this, '${idSession}', '${nom}')" 
                                    class="${estAbsent ? 'bg-red-500' : 'bg-emerald-500'} text-white px-5 py-2 rounded-lg text-[10px] font-black shadow-sm w-28 uppercase tracking-widest transition-all">
                                ${estAbsent ? 'Absent' : 'Présent'}
                            </button>
                        </td>
                    </tr>
                `;
                listeCorps.innerHTML += ligne;
            });
            
            if (ongletActif === 'absents' && listeCorps.innerHTML === "") {
                listeCorps.innerHTML = `<tr><td colspan="2" class="p-10 text-center text-gray-400 font-bold italic">Aucun absent pour le moment 🎉</td></tr>`;
            }

            mettreAJourStats(idSession, classe);
        }

        function toggleAbsence(btn, idSession, nom) {
            if (!absences[idSession]) absences[idSession] = [];

            if (btn.innerText === "PRÉSENT") {
                btn.innerText = "ABSENT";
                btn.classList.replace("bg-emerald-500", "bg-red-500");
                absences[idSession].push(nom);
            } else {
                btn.innerText = "PRÉSENT";
                btn.classList.replace("bg-red-500", "bg-emerald-500");
                absences[idSession] = absences[idSession].filter(n => n !== nom);
            }
            localStorage.setItem("absences_v4_hadri", JSON.stringify(absences));
            const classe = document.getElementById('classe-select').value;
            mettreAJourStats(idSession, classe);
        }

        function mettreAJourStats(idSession, classe) {
            const total = donnéesClasses[classe].length;
            const absents = absences[idSession] ? absences[idSession].length : 0;
            document.getElementById('stats').innerText = `${absents} ABSENT(S) / ${total}`;
        }

        function reinitialiser() {
            if(confirm("Effacer les données de cet appel ?")) {
                const date = document.getElementById('date-select').value;
                const classe = document.getElementById('classe-select').value;
                const heure = document.getElementById('heure-select').value;
                const matiere = document.getElementById('matiere-select').value;
                absences[`${date}_${classe}_${heure}_${matiere}`] = [];
                localStorage.setItem("absences_v4_hadri", JSON.stringify(absences));
                changerContexte();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
