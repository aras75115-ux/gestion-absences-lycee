<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Appel Pro - Lycée EL HADRI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1b4b">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="loading-overlay" class="fixed inset-0 bg-indigo-900/40 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-5 rounded-2xl shadow-2xl flex flex-col items-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-900 mb-3"></div>
            <p class="text-indigo-900 font-bold text-[10px] uppercase">Synchronisation Cloud...</p>
        </div>
    </div>

    <div class="max-w-4xl mx-auto bg-white min-h-screen shadow-xl">
        <div class="bg-indigo-900 p-6 text-white text-center shadow-lg">
            <h1 class="text-lg font-black uppercase tracking-tighter">Lycée EL HADRI</h1>
            <p class="text-[9px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Registre Numérique des Absences</p>
        </div>

        <div class="p-4 bg-indigo-50/50 border-b border-indigo-100 no-print">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <div>
                    <label class="block text-[9px] font-black text-indigo-400 uppercase mb-1">Date</label>
                    <input type="date" id="date-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs">
                </div>
                <div>
                    <label class="block text-[9px] font-black text-indigo-400 uppercase mb-1">Classe</label>
                    <select id="classe-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs">
                        <option value="2 BAC SVT">2 BAC SVT</option>
                        <option value="2 BAC PC">2 BAC PC</option>
                        <option value="2BAC SPC FR">2BAC SPC FR</option>
                        <option value="1BAC SLH-3">1BAC SLH-3</option>
                        <option value="1BAC LSH-4">1BAC LSH-4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[9px] font-black text-indigo-400 uppercase mb-1">Heure</label>
                    <select id="heure-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs">
                        <option value="08-09">08:00 - 09:00</option>
                        <option value="09-10">09:00 - 10:00</option>
                        <option value="10-11">10:00 - 11:00</option>
                        <option value="11-12">11:00 - 12:00</option>
                        <option value="14-15">14:00 - 15:00</option>
                        <option value="15-16">15:00 - 16:00</option>
                        <option value="16-17">16:00 - 17:00</option>
                        <option value="17-18">17:00 - 18:00</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[9px] font-black text-indigo-400 uppercase mb-1">Matière</label>
                    <select id="matiere-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs">
                        <option value="Français">Français</option>
                        <option value="SVT">SVT</option>
                        <option value="Physique">Physique</option>
                        <option value="Maths">Maths</option>
                        <option value="Anglais">Anglais</option>
                        <option value="Arabe">Arabe</option>
                        <option value="Philo">Philo</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 justify-center border-t border-indigo-100 pt-4">
                <button onclick="genererBilanJournalier()" class="bg-amber-500 text-white px-3 py-2 rounded-lg font-black text-[9px] uppercase shadow-md active:scale-95">📊 Bilan Jour</button>
                <button onclick="genererStats('semaine')" class="bg-emerald-600 text-white px-3 py-2 rounded-lg font-black text-[9px] uppercase shadow-md active:scale-95">📅 Hebdo</button>
                <button onclick="genererStats('mois')" class="bg-indigo-600 text-white px-3 py-2 rounded-lg font-black text-[9px] uppercase shadow-md active:scale-95">🗓️ Mensuel</button>
                <button onclick="syncDepuisCloud()" class="bg-slate-700 text-white px-3 py-2 rounded-lg font-black text-[9px] uppercase shadow-md active:scale-95">🔄 Sync</button>
            </div>
        </div>

        <div class="p-4">
            <div class="flex justify-between items-center mb-4 border-b-2 border-indigo-50 pb-2">
                <h2 id="titre-zone" class="text-xs font-black text-indigo-900 uppercase italic">Appel en cours</h2>
                <div id="stats-badge" class="bg-indigo-600 text-white px-3 py-1 rounded-full font-black text-[10px]">0 ABSENTS</div>
            </div>

            <div id="affichage-principal" class="pb-24">
                <table class="w-full border-collapse">
                    <tbody id="student-list" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-gray-100 flex gap-2 no-print max-w-4xl mx-auto">
            <button onclick="window.print()" class="flex-1 bg-slate-900 text-white py-4 rounded-xl font-black text-[10px] uppercase shadow-lg">Imprimer</button>
            <button onclick="partagerWhatsApp()" class="flex-1 bg-green-600 text-white py-4 rounded-xl font-black text-[10px] uppercase shadow-lg">WhatsApp</button>
        </div>
    </div>

    <script>
        const API_URL = "VOTRE_URL_GOOGLE_SCRIPT_ICI";

        const donnéesClasses = {
            "2 BAC SVT": ["El Bouchibi Fatima", "Ez-Zaitouni Wiame", "Hammane Kaoutar", "El Mourabit Mohammed", "Esstitou Omar", "El Hadri Aya", "El Hadri Imane", "El Hadri Aymane", "El Mourabit Houdayfa", "Oudair Siham", "El Haddad Abdelaziz", "El Massari Ahlam", "El Mamoun Mohammed", "Yechou OLYA", "Es-Sebai Mounia", "El Mliles Hatim", "El younsi Doha", "El Meskini Yousra", "El Fayah Reda", "Nass Kassem Oussama", "ELladhi Safae", "Ramli Wafae", "El Mamouni Sajida"],
            "2 BAC PC": ["El Afia Safae", "ElLdhi Adnan", "El krioui Houdayfa", "Azzouz Mohammed", "Chaffani Rofida"],
            "2BAC SPC FR": ["El Massari Yaacoub", "El Assaoui Ouidad", "El Hammam Mohammed Anas", "El Faghloumi Mohammed Amine", "Abouali Nada", "El Faghloumi Yassir", "Doha El Rifi", "Merouane Oumaima", "Hanan Chafia", "Ajenoun Ech-Chaibi Adam", "El Mebless Safae", "Er-Rifi Islah", "El Amri Aya", "El Younsi Nada", "El Bakali Hafsa", "El Bakali Mohammed", "Zineb Er-Rafas", "Aalilou Ouidad", "El Belhaissani Adam", "El Afia Farah", "El Meskini Hidaya", "Ech-Chaibi Alae", "Douae Ben hssayne", "El Ghedouani Yahya"],
            "1BAC SLH-3": ["Ferbal Ayoub", "El Hadri Awatif", "El Khebat Mohammed", "Benerim Remissa", "El Ghoual Aya", "El Khebat Zaid", "Aârim Mohammed Yassine", "El Haddad Abdelkafi", "El Haddar Abderrahmane", "El Berremani Mohammed", "El Abdouni Manal", "El Hassini Douae", "El Jebbari Kholoud", "Ed-Derraz Fatima", "El Massari Mohammed", "Slimane El Abboudi", "Younes El Abboudi", "Ibrahim Wissal", "Oulad Hammidou Mohammed Ben Mohammed", "Aidoune Mohammed Reda", "El Jebbari Maryam", "El Abous Neamat", "Aârim Mohammed", "Kerbal Ahmed", "Aharmim Badr Eddine", "Aharmim Solimane Abdessalam", "Ahremim Fatima Zohra", "El Faghloumi Mohammed", "Oudaber Hafsa", "El Bezrani Mansour", "El Bounsi Nassira", "Boukhalef Aya Abdelaziz", "El Ladehi Mohammed Reda", "Ez-Zaitouni Mohammed", "El Bakali Et-Tahiri Aya", "El Younssfi Douae", "Aârim Rabie", "Es-Sellassi Wail", "El Mamoun Dina", "El Bakali Malak", "El Bakali Mouna", "Jebrone Youssef", "Ed-Derkaoui Younes"],
            "1BAC LSH-4": ["chouli Mohammed", "Ez-Zaitouni Mohammed", "Stitou Halima", "El Faghloumi Abdelmounaim", "El Aissaoui Mohammed", "El Khayat Mohammed Abdelkhalek", "Ed-Derraz Zineb", "El Jebbari Khadija", "Tohouach Solimane", "El Khayat Marouane", "Ez-Zerhouni Nihad", "El Khayat Rayane", "El Meskini Sabah", "Ajan Ferdaws", "El Mourabit Ihssane", "El Mourabit Hasnaa", "El Haddad Kaoutar", "Mohammed Ali Ez-Zaitouni", "El Amrani Mohammed", "El Kharboufi Mohammed", "El Jebbari Ferdaws", "Safae Ibn Ihssane", "Ferbal Badr Eddine", "El Hajjam Mohammed", "Esh-Shouni Aya", "El Assaoui Dalal", "El Khebat Mohammed Said", "El Haddad Siham", "El Mourabit Awatif", "Es-Sbino Salma", "Ed-Derraz Khawla", "Oudaber Salah Eddine", "El Khebat Adam", "Ajenoun Ech-Chaibi Imane", "Rami Mohammed Amine", "Ed-Derfaoui Mohammed Sami", "Maouloud Yassine", "Dandan Youssef", "Adrebouch Mohammed", "El Kraymi Yassine", "Ed-Derfaoui Alae"]
        };

        let absences = JSON.parse(localStorage.getItem("absences_v6_hadri")) || {};

        function changerContexte() {
            const date = document.getElementById('date-select').value;
            const classe = document.getElementById('classe-select').value;
            const heure = document.getElementById('heure-select').value;
            const idSession = `${date}_${classe}_${heure}_${document.getElementById('matiere-select').value}`;

            // Détection heure précédente
            const créneaux = ["08-09", "09-10", "10-11", "11-12", "14-15", "15-16", "16-17", "17-18"];
            const idx = créneaux.indexOf(heure);
            let hPrec = idx > 0 ? créneaux[idx-1] : null;
            let listHPrec = [];
            if(hPrec) {
                Object.keys(absences).forEach(k => {
                    if(k.startsWith(`${date}_${classe}_${hPrec}`)) listHPrec = [...new Set([...listHPrec, ...absences[k]])];
                });
            }

            document.getElementById('titre-zone').innerText = "Appel : " + classe;
            const body = document.getElementById('student-list');
            body.innerHTML = "";

            donnéesClasses[classe].forEach(nom => {
                const estAbsent = absences[idSession]?.includes(nom);
                const etaitAbsent = listHPrec.includes(nom);
                body.innerHTML += `
                    <tr class="border-b ${etaitAbsent && !estAbsent ? 'bg-orange-50' : ''}">
                        <td class="p-3 text-xs font-bold">
                            ${nom} ${etaitAbsent ? '<br><span class="text-[7px] text-orange-600 uppercase">⚠ Absent heure précédente</span>' : ''}
                        </td>
                        <td class="p-3 text-right">
                            <button onclick="toggleAbsence(this, '${idSession}', '${nom}')" 
                                class="px-4 py-2 rounded-lg text-[9px] font-black uppercase ${estAbsent ? 'bg-red-500 text-white' : 'bg-slate-100 text-slate-400'}">
                                ${estAbsent ? 'Absent' : 'Présent'}
                            </button>
                        </td>
                    </tr>`;
            });
            document.getElementById('stats-badge').innerText = (absences[idSession]?.length || 0) + " ABSENTS";
        }

        async function toggleAbsence(btn, id, nom) {
            if(!absences[id]) absences[id] = [];
            let action = "";
            if(!absences[id].includes(nom)) { absences[id].push(nom); action = "Absent"; }
            else { absences[id] = absences[id].filter(n => n !== nom); action = "Présent"; }
            
            localStorage.setItem("absences_v6_hadri", JSON.stringify(absences));
            changerContexte();

            if(!API_URL.includes("VOTRE_URL")) {
                fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({
                    id, nom, action, date: id.split('_')[0], classe: id.split('_')[1], heure: id.split('_')[2], matiere: id.split('_')[3]
                })});
            }
        }

        // --- FONCTIONS DE BILANS ---

        function genererBilanJournalier() {
            const date = document.getElementById('date-select').value;
            document.getElementById('titre-zone').innerText = "Rapport du " + date;
            const body = document.getElementById('student-list');
            let html = "";
            let total = 0;

            Object.keys(absences).filter(k => k.startsWith(date)).forEach(id => {
                const [d, cl, h, m] = id.split('_');
                total += absences[id].length;
                html += `
                    <tr class="bg-indigo-900 text-white"><td colspan="2" class="p-2 text-[10px] font-bold uppercase">${h}h | ${cl} (${m})</td></tr>
                    <tr><td colspan="2" class="p-3 text-xs text-red-600 font-bold">${absences[id].length > 0 ? absences[id].join(', ') : 'Aucun absent'}</td></tr>
                `;
            });
            body.innerHTML = html || "<tr><td class='p-10 text-center text-gray-400'>Aucune donnée pour ce jour</td></tr>";
            document.getElementById('stats-badge').innerText = "TOTAL : " + total;
        }

        function genererStats(periode) {
            const body = document.getElementById('student-list');
            document.getElementById('titre-zone').innerText = "Statistiques " + periode;
            let stats = {};
            
            Object.keys(absences).forEach(id => {
                absences[id].forEach(nom => {
                    stats[nom] = (stats[nom] || 0) + 1;
                });
            });

            let tri = Object.entries(stats).sort((a,b) => b[1] - a[1]);
            let html = `<tr class="bg-slate-800 text-white font-bold text-[9px] uppercase"><td class="p-2">Nom de l'élève</td><td class="p-2 text-center">Nombre d'absences</td></tr>`;
            tri.forEach(([nom, nb]) => {
                html += `<tr class="border-b"><td class="p-3 text-xs font-bold">${nom}</td><td class="p-3 text-center text-red-600 font-black">${nb}</td></tr>`;
            });
            body.innerHTML = tri.length > 0 ? html : "<tr><td class='p-10 text-center text-gray-400'>Aucune statistique disponible</td></tr>";
        }

        async function syncDepuisCloud() {
            if(API_URL.includes("VOTRE_URL")) return;
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                absences = {};
                data.slice(1).forEach(r => {
                    if(r[6] === "Absent") {
                        if(!absences[r[0]]) absences[r[0]] = [];
                        absences[r[0]].push(r[5]);
                    }
                });
                localStorage.setItem("absences_v6_hadri", JSON.stringify(absences));
                changerContexte();
            } catch(e) { alert("Erreur de synchronisation"); }
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function partagerWhatsApp() {
            const date = document.getElementById('date-select').value;
            const texte = `*Lycée EL HADRI - Rapport*\nDate: ${date}\n${document.getElementById('stats-badge').innerText}\n\nConsultez le registre pour plus de détails.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(texte)}`);
        }

        window.onload = () => {
            document.getElementById('date-select').value = new Date().toISOString().split('T')[0];
            changerContexte();
            syncDepuisCloud();
        };
    </script>
</body>
</html>
