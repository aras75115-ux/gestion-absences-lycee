<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الغياب - ثانوية الحاج محمد بن حساين الحضري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* تصميم جداول التقارير */
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .report-table th { background-color: #1e1b4b; color: white; padding: 10px; font-size: 11px; border: 1px solid #312e81; }
        .report-table td { padding: 10px; border: 1px solid #e2e8f0; text-align: center; font-size: 12px; }
        .critical-absent { background-color: #fef2f2; color: #b91c1c; font-weight: bold; }
        
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-4xl mx-auto bg-white min-h-screen shadow-2xl pb-32">
        <div class="bg-indigo-950 p-6 text-white text-center border-b-4 border-amber-500">
            <h1 class="text-sm md:text-xl font-black mb-1">الثانوية التأهيلية الحاج محمد بن حساين الحضري</h1>
            <div class="flex justify-center items-center gap-2">
                <div class="h-2 w-2 bg-emerald-400 rounded-full animate-pulse"></div>
                <p class="text-[10px] font-bold text-indigo-200 uppercase tracking-widest">منظومة تدبير الغياب المدرسي</p>
            </div>
        </div>

        <div class="p-4 bg-slate-100 border-b no-print space-y-3">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-right">
                <div>
                    <label class="text-[9px] font-bold text-slate-500 mr-1">التاريخ</label>
                    <input type="date" id="date-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs">
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 mr-1">القسم</label>
                    <select id="classe-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs font-sans">
                        <option value="2 BAC SVT">2 BAC SVT</option>
                        <option value="2 BAC PC">2 BAC PC</option>
                        <option value="2BAC SPC FR">2BAC SPC FR</option>
                        <option value="1BAC SLH-3">1BAC SLH-3</option>
                        <option value="1BAC LSH-4">1BAC LSH-4</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 mr-1">الحصة</label>
                    <select id="heure-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs" dir="ltr">
                        <option value="08-09">08:00 - 09:00</option>
                        <option value="09-10">09:00 - 10:00</option>
                        <option value="10-11">10:00 - 11:00</option>
                        <option value="11-12">11:00 - 12:00</option>
                        <option value="14-15">14:00 - 15:00</option>
                        <option value="15-16">15:00 - 16:00</option>
                        <option value="16-17">16:00 - 17:00</option>
                        <option value="17-18">17:00 - 18:00</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 mr-1">المادة</label>
                    <select id="matiere-select" onchange="changerContexte()" class="w-full p-2.5 rounded-xl border-none shadow-sm font-bold text-indigo-900 text-xs">
                        <option value="العربية">اللغة العربية</option>
                        <option value="الفرنسية">اللغة الفرنسية</option>
                        <option value="الرياضيات">الرياضيات</option>
                        <option value="الفيزياء">الفيزياء والكيمياء</option>
                        <option value="SVT">علوم الحياة والأرض</option>
                        <option value="الفلسفة">الفلسفة</option>
                        <option value="الإنجليزية">الإنجليزية</option>
                        <option value="الاجتماعيات">الاجتماعيات</option>
                        <option value="الإسلاميات">التربية الإسلامية</option>
                        <option value="الرياضة">التربية البدنية</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 justify-center pt-2 border-t border-slate-200">
                <button onclick="genererBilanJournalier()" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow active:scale-95 transition-all">📊 تقرير يومي</button>
                <button onclick="genererRapportPeriode(7)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow active:scale-95 transition-all">📅 تقرير أسبوعي</button>
                <button onclick="genererRapportPeriode(30)" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow active:scale-95 transition-all">🗓️ تقرير شهري</button>
                <button onclick="effacerDonnees()" class="bg-slate-400 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow active:scale-95 transition-all">🗑️ مسح الذاكرة</button>
            </div>
        </div>

        <div class="p-4">
            <div id="alert-day" class="hidden mb-4 p-3 bg-blue-50 border-r-4 border-blue-600 text-blue-800 text-[10px] font-bold animate-pulse">
                ℹ️ معلومات: تم ترحيل غياب الحصة الأخيرة من اليوم السابق تلقائياً.
            </div>
            
            <div class="flex justify-between items-center mb-4 pb-2 border-b-2 border-slate-100">
                <h2 id="view-title" class="text-xs font-black text-indigo-900 uppercase underline decoration-amber-500 underline-offset-4">لائحة القسم</h2>
                <div id="count-badge" class="bg-red-600 text-white px-4 py-1 rounded-full text-[10px] font-black shadow-lg shadow-red-200">0 غائب</div>
            </div>

            <div id="display-area">
                <table class="w-full">
                    <tbody id="student-list" class="divide-y divide-slate-100 border-b border-slate-100"></tbody>
                </table>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur-sm border-t flex gap-2 max-w-4xl mx-auto no-print z-50">
            <button onclick="window.print()" class="flex-1 bg-slate-900 text-white py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all">🖨️ طباعة اللائحة</button>
            <button onclick="partagerWhatsApp()" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all">💬 واتساب</button>
        </div>
    </div>

    <script>
        const donnéesClasses = {
            "2 BAC SVT": ["البوشيبي فاطمة", "الزيتوني وئام", "حمان كوثر", "المرابط محمد", "ستيتو عمر", "الهادري آية", "الهادري إيمان", "الهادري أيمن", "المرابط حذيفة", "أودير سهام", "الحداد عبد العزيز", "المساري أحلام", "المأمون محمد", "يشو علياء", "السباعي مونية", "الملليس حاتم", "اليونسي ضحى", "المسكيني يسرا", "الفياض رضا", "ناص قاسم أسامة", "اللضي صفاء", "رملي وفاء", "المأموني ساجدة"],
            "2 BAC PC": ["العفية صفاء", "اللضي عدنان", "كريوي حذيفة", "عزوز محمد", "شفاني رفيدة"],
            "2BAC SPC FR": ["المساري يعقوب", "العساوي وداد", "الحمام محمد أنس", "الفغلومي محمد أمين", "أبوعلي ندى", "الفغلومي ياسر", "ضحى الريفي", "مروان أميمة", "حنان شافية", "أجنون الشايبي آدم", "المبلس صفاء", "الريفي إصلاح", "العمري آية", "اليونسي ندى", "البقالي حفصة", "البقالي محمد", "زينب الرفاص", "عليلوا وداد", "بلحيساني آدم", "العفية فرح", "المسكيني هداية", "الشايبي آلاء", "دعاء بن حسين", "الغدواني يحيى"],
            "1BAC SLH-3": ["فربال أيوب", "الهادري عواطف", "الخياط محمد", "بنريم رميساء", "الغوال آية", "الخياط زيد", "عريم محمد ياسين", "الحداد عبد الكافي", "الحدار عبد الرحمن", "البرماني محمد", "العبدوني منال", "الحسيني دعاء", "الجباري خلود", "الدراز فاطمة", "المساري محمد", "سليمان العبودي", "يونس العبودي", "إبراهيم وصال", "أولاد حميدو محمد بن محمد", "عيدون محمد رضا", "الجباري مريم", "العبوس نعمات", "عريم محمد", "كربال أحمد", "أحرميم بدر الدين", "أحرميم سليمان عبد السلام", "أحرميم فاطمة الزهراء", "الفغلومي محمد", "أودابر حفصة", "البزراني منصور", "البونسي نصيرة", "بوخلف آية عبد العزيز", "اللضي محمد رضا", "الزيتوني محمد", "البقالي الطاهري آية", "اليوسفي دعاء", "عريم ربيع", "السلاسي وائل", "المأمون دينا", "البقالي ملاك", "البقالي منى", "جبرون يوسف", "الدرقاوي يونس"],
            "1BAC LSH-4": ["شولي محمد", "الزيتوني محمد", "ستيتو حليمة", "الفغلومي عبد المنعم", "العساوي محمد", "الخياط محمد عبد الخالق", "الدراز زينب", "الجباري خديجة", "تحواش سليمان", "الخياط مروان", "الزرهوني نهاد", "الخياط ريان", "المسكيني صباح", "أجان فردوس", "المرابط إحسان", "المرابط حسناء", "الحداد كوثر", "محمد علي الزيتوني", "العمراني محمد", "الخربوفي محمد", "الجباري فردوس", "صفاء ابن إحسان", "فربال بدر الدين", "الحجام محمد", "الشوني آية", "العساوي دلال", "الخياط محمد سعيد", "الحداد سهام", "المرابط عواطف", "السبينو سلمى", "الدراز خولة", "أودابر صلاح الدين", "الخياط آدم", "أجنون الشايبي إيمان", "رامي محمد أمين", "الدرقاوي محمد سامي", "مولود ياسين", "دندان يوسف", "أدربوش محمد", "كريمي ياسين", "الدرقاوي آلاء"]
        };

        let absences = JSON.parse(localStorage.getItem("db_hadri_pro")) || {};

        function changerContexte() {
            const date = document.getElementById('date-select').value;
            const classe = document.getElementById('classe-select').value;
            const heure = document.getElementById('heure-select').value;
            const mat = document.getElementById('matiere-select').value;
            const idSession = `${date}_${classe}_${heure}_${mat}`;
            
            document.getElementById('alert-day').classList.add('hidden');
            const créneaux = ["08-09", "09-10", "10-11", "11-12", "14-15", "15-16", "16-17", "17-18"];
            const idx = créneaux.indexOf(heure);
            let absImport = [];

            // منطق الاستيراد
            if (idx > 0) {
                const hAvant = créneaux[idx-1];
                Object.keys(absences).forEach(k => {
                    if(k.startsWith(`${date}_${classe}_${hAvant}`)) absImport = [...new Set([...absImport, ...absences[k]])];
                });
            } else {
                // ترحيل من اليوم السابق
                const hier = new Date(date); hier.setDate(hier.getDate() - 1);
                const hierStr = hier.toISOString().split('T')[0];
                let sHier = Object.keys(absences).filter(k => k.startsWith(`${hierStr}_${classe}`));
                if (sHier.length > 0) {
                    sHier.sort().reverse();
                    absImport = [...absences[sHier[0]]];
                    if (absImport.length > 0 && !absences[idSession]) document.getElementById('alert-day').classList.remove('hidden');
                }
            }

            if (!absences[idSession] && absImport.length > 0) absences[idSession] = [...absImport];
            afficherListe(idSession, absImport);
        }

        function afficherListe(idSession, absImport) {
            const classe = document.getElementById('classe-select').value;
            const body = document.getElementById('student-list');
            document.getElementById('view-title').innerText = "تسجيل الغياب: " + classe;
            body.innerHTML = "";

            donnéesClasses[classe].forEach(nom => {
                const estAbsent = absences[idSession]?.includes(nom);
                const etaitAbsentPrec = absImport.includes(nom);
                body.innerHTML += `
                    <tr class="transition-all ${estAbsent ? 'bg-red-50' : (etaitAbsentPrec ? 'bg-orange-50' : '')}">
                        <td class="p-4 text-right">
                            <div class="font-bold text-sm text-slate-800">${nom}</div>
                            ${etaitAbsentPrec ? '<div class="text-[8px] text-orange-600 font-bold italic tracking-tighter">يوجه الى الادارة</div>' : ''}
                        </td>
                        <td class="p-4 text-left">
                            <button onclick="toggleAbsence('${idSession}', '${nom}')" 
                                class="w-24 py-2.5 rounded-xl text-[10px] font-black uppercase transition-all active:scale-90 ${estAbsent ? 'bg-red-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}">
                                ${estAbsent ? 'غائـب' : 'حاضـر'}
                            </button>
                        </td>
                    </tr>`;
            });
            document.getElementById('count-badge').innerText = (absences[idSession]?.length || 0) + " غائب";
        }

        function toggleAbsence(id, nom) {
            if(!absences[id]) absences[id] = [];
            if(!absences[id].includes(nom)) absences[id].push(nom);
            else absences[id] = absences[id].filter(n => n !== nom);
            localStorage.setItem("db_hadri_pro", JSON.stringify(absences));
            changerContexte();
        }

        function genererBilanJournalier() {
            const date = document.getElementById('date-select').value;
            const body = document.getElementById('display-area');
            document.getElementById('view-title').innerText = "تقرير اليوم: " + date;
            let html = '<div class="space-y-4">';
            
            Object.keys(absences).filter(k => k.startsWith(date)).sort().forEach(id => {
                const [d, cl, h, m] = id.split('_');
                html += `
                    <div class="border rounded-xl overflow-hidden shadow-sm">
                        <div class="bg-slate-800 text-white p-2 text-[10px] flex justify-between px-4 font-bold">
                            <span>الحصة: ${h}</span><span>القسم: ${cl}</span><span>المادة: ${m}</span>
                        </div>
                        <div class="p-3 text-[11px] bg-white leading-relaxed text-red-600 font-bold">
                            ${absences[id].length > 0 ? absences[id].join(' | ') : '<span class="text-emerald-600">لا يوجد غياب</span>'}
                        </div>
                    </div>`;
            });
            body.innerHTML = html + "</div>";
        }

        function genererRapportPeriode(jours) {
            const targetClasse = document.getElementById('classe-select').value;
            document.getElementById('view-title').innerText = `تقرير (${jours === 7 ? 'أسبوعي' : 'شهري'}): ${targetClasse}`;
            const display = document.getElementById('display-area');
            let stats = {};
            donnéesClasses[targetClasse].forEach(nom => stats[nom] = 0);

            const startLimit = new Date();
            startLimit.setDate(startLimit.getDate() - jours);

            Object.keys(absences).forEach(id => {
                const [date, classe] = id.split('_');
                if (classe === targetClasse && new Date(date) >= startLimit) {
                    absences[id].forEach(nom => { if(stats[nom] !== undefined) stats[nom]++; });
                }
            });

            let html = `<table class="report-table"><thead><tr><th>اسم التلميذ(ة)</th><th>ساعات الغياب</th><th>الحالة</th></tr></thead><tbody>`;
            Object.entries(stats).sort((a,b) => b[1] - a[1]).forEach(([nom, count]) => {
                let status = count >= 10 ? '🔴 إنذار' : (count > 0 ? '🟠 متابعة' : '🟢 سليم');
                html += `<tr class="${count >= 10 ? 'critical-absent' : ''}">
                    <td class="text-right font-bold">${nom}</td>
                    <td>${count} ساعة</td>
                    <td>${status}</td>
                </tr>`;
            });
            display.innerHTML = html + "</tbody></table>";
        }

        function effacerDonnees() {
            if(confirm("هل تريد مسح جميع البيانات المخزنة؟ لا يمكن استرجاعها.")) {
                localStorage.removeItem("db_hadri_pro");
                absences = {};
                location.reload();
            }
        }

        function partagerWhatsApp() {
            const date = document.getElementById('date-select').value;
            const classe = document.getElementById('classe-select').value;
            const count = document.getElementById('count-badge').innerText;
            const msg = `*ثانوية الحاج محمد بن حساين الحضري*\nتقرير غياب: ${classe}\nبتاريخ: ${date}\nالنتيجة: ${count}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        }

        window.onload = () => {
            document.getElementById('date-select').value = new Date().toISOString().split('T')[0];
            changerContexte();
        };
    </script>
  <div class="no-print mt-8 pb-6 text-center border-t border-slate-100 pt-4">
    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
        &copy; 2026 جميع الحقوق محفوظة
    </p>
    <p class="text-xs font-black text-indigo-900 mt-1">
        تصميم وتطوير: <span class="text-amber-600">Prof. Mohamed EL KHOUMSSI</span>
    </p>
</div>
</body>
</html>
