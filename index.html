<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الغياب المتكامل - ثانوية الحضري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        
        /* تنسيق الجداول للتقارير */
        .report-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        .report-table th { background-color: #1e1b4b; color: white; padding: 8px; font-size: 10px; border: 1px solid #312e81; }
        .report-table td { padding: 8px; border: 1px solid #e2e8f0; text-align: center; font-size: 11px; }
        .x-mark { color: #dc2626; font-weight: 900; font-size: 14px; }
        
        @media print { 
            .no-print { display: none !important; }
            .print-break { page-break-after: always; }
            body { background: white; padding: 0; }
            .max-w-4xl { max-width: 100% !important; width: 100% !important; }
        }
    </style>
</head>
<body class="pb-32">

    <div class="max-w-4xl mx-auto bg-white min-h-screen shadow-2xl overflow-hidden">
        <div class="bg-indigo-950 p-6 text-white text-center border-b-4 border-amber-500">
            <h1 class="text-lg md:text-xl font-black mb-1">الثانوية التأهيلية الحاج محمد بن حساين الحضري</h1>
            <p class="text-[10px] font-bold text-indigo-300 tracking-widest uppercase">نظام الرصد والتقارير اليومية، الأسبوعية والشهرية</p>
        </div>

        <div class="p-4 bg-slate-50 border-b no-print space-y-3">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <div>
                    <label class="text-[9px] font-bold text-slate-500 block mb-1">التاريخ</label>
                    <input type="date" id="date-select" onchange="initApp()" class="w-full p-2 rounded-lg border border-slate-200 font-bold text-xs">
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 block mb-1">القسم الحالي</label>
                    <select id="classe-select" onchange="initApp()" class="w-full p-2 rounded-lg border border-slate-200 font-bold text-xs">
                        <option>2 BAC SVT</option><option>2 BAC PC</option>
                        <option>2BAC SPC FR</option><option>1BAC SLH-3</option>
                        <option>1BAC LSH-4</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 block mb-1">الحصة</label>
                    <select id="heure-select" onchange="initApp()" class="w-full p-2 rounded-lg border border-slate-200 font-bold text-xs" dir="ltr">
                        <option value="08-09">08:00 - 09:00</option><option value="09-10">09:00 - 10:00</option>
                        <option value="10-11">10:00 - 11:00</option><option value="11-12">11:00 - 12:00</option>
                        <option value="14-15">14:00 - 15:00</option><option value="15-16">15:00 - 16:00</option>
                        <option value="16-17">16:00 - 17:00</option><option value="17-18">17:00 - 18:00</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 block mb-1">المادة</label>
                    <select id="matiere-select" class="w-full p-2 rounded-lg border border-slate-200 font-bold text-xs">
                        <option>الرياضيات</option><option>الفيزياء</option><option>العربية</option>
                        <option>الفرنسية</option><option>SVT</option><option>الفلسفة</option>
                        <option>الإنجليزية</option><option>الاجتماعيات</option><option>الرياضة</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 justify-center border-t pt-3">
                <button onclick="renderDailyReport()" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow">📊 تقرير يومي (X)</button>
                <button onclick="renderPeriodicReport(7)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow">📅 تقرير أسبوعي</button>
                <button onclick="renderPeriodicReport(30)" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-[10px] shadow">🗓️ تقرير شهري</button>
            </div>
        </div>

        <div class="p-4" id="main-view">
            <div id="admin-alert" class="hidden mb-4 p-3 bg-orange-50 border-r-4 border-orange-500 text-orange-800 text-[10px] font-bold animate-pulse">
                ⚠️ تنبيه: التلميذ لديه غياب سابق، يرجى توجيهه للإدارة.
            </div>
            
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="view-title" class="font-black text-indigo-900 text-sm">لوحة التسجيل</h2>
                <div id="abs-badge" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] font-black">0 غائب</div>
            </div>

            <div id="display-content">
                <table class="w-full">
                    <tbody id="student-rows" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex gap-2 max-w-4xl mx-auto no-print z-50">
            <button onclick="window.print()" class="flex-1 bg-slate-900 text-white py-4 rounded-xl font-black text-xs shadow-lg">🖨️ طباعة التقرير</button>
            <button onclick="location.reload()" class="flex-1 bg-indigo-700 text-white py-4 rounded-xl font-black text-xs shadow-lg">🔄 تحديث</button>
        </div>
    </div>

    <script>
        const DATA = {
            "2 BAC SVT": ["البوشيبي فاطمة", "الزيتوني وئام", "حمان كوثر", "المرابط محمد", "ستيتو عمر", "الهادري آية", "الهادري إيمان", "الهادري أيمن", "المرابط حذيفة", "أودير سهام", "الحداد عبد العزيز", "المساري أحلام", "المأمون محمد", "يشو علياء", "السباعي مونية", "الملليس حاتم", "اليونسي ضحى", "المسكيني يسرا", "الفياض رضا", "ناص قاسم أسامة", "اللضي صفاء", "رملي وفاء", "المأموني ساجدة"],
            "2 BAC PC": ["العفية صفاء", "اللضي عدنان", "كريوي حذيفة", "عزوز محمد", "شفاني رفيدة"],
            "2BAC SPC FR": ["المساري يعقوب", "العساوي وداد", "الحمام محمد أنس", "الفغلومي محمد أمين", "أبوعلي ندى", "الفغلومي ياسر", "ضحى الريفي", "مروان أميمة", "حنان شافية", "أجنون الشايبي آدم", "المبلس صفاء", "الريفي إصلاح", "العمري آية", "اليونسي ندى", "البقالي حفصة", "البقالي محمد", "زينب الرفاص", "عليلوا وداد", "بلحيساني آدم", "العفية فرح", "المسكيني هداية", "الشايبي آلاء", "دعاء بن حسين", "الغدواني يحيى"],
            "1BAC SLH-3": ["فربال أيوب", "الهادري عواطف", "الخياط محمد", "بنريم رميساء", "الغوال آية", "الخياط زيد", "عريم محمد ياسين", "الحداد عبد الكافي", "الحدار عبد الرحمن", "البرماني محمد", "العبدوني منال", "الحسيني دعاء", "الجباري خلود", "الدراز فاطمة", "المساري محمد", "سليمان العبودي", "يونس العبودي", "إبراهيم وصال", "أولاد حميدو محمد بن محمد", "عيدون محمد رضا", "الجباري مريم", "العبوس نعمات", "عريم محمد", "كربال أحمد", "أحرميم بدر الدين", "أحرميم سليمان عبد السلام", "أحرميم فاطمة الزهراء", "الفغلومي محمد", "أودابر حفصة", "البزراني منصور", "البونسي نصيرة", "بوخلف آية عبد العزيز", "اللضي محمد رضا", "الزيتوني محمد", "البقالي الطاهري آية", "اليوسفي دعاء", "عريم ربيع", "السلاسي وائل", "المأمون دينا", "البقالي ملاك", "البقالي منى", "جبرون يوسف", "الدرقاوي يونس"],
            "1BAC LSH-4": ["شولي محمد", "الزيتوني محمد", "ستيتو حليمة", "الفغلومي عبد المنعم", "العساوي محمد", "الخياط محمد عبد الخالق", "الدراز زينب", "الجباري خديجة", "تحواش سليمان", "الخياط مروان", "الزرهوني نهاد", "الخياط ريان", "المسكيني صباح", "أجان فردوس", "المرابط إحسان", "المرابط حسناء", "الحداد كوثر", "محمد علي الزيتوني", "العمراني محمد", "الخربوفي محمد", "الجباري فردوس", "صفاء ابن إحسان", "فربال بدر الدين", "الحجام محمد", "الشوني آية", "العساوي دلال", "الخياط محمد سعيد", "الحداد سهام", "المرابط عواطف", "السبينو سلمى", "الدراز خولة", "أودابر صلاح الدين", "الخياط آدم", "أجنون الشايبي إيمان", "رامي محمد أمين", "الدرقاوي محمد سامي", "مولود ياسين", "دندان يوسف", "أدربوش محمد", "كريمي ياسين", "الدرقاوي آلاء"]
        };

        const HOURS = ["08-09", "09-10", "10-11", "11-12", "14-15", "15-16", "16-17", "17-18"];
        let db = JSON.parse(localStorage.getItem("hadri_v_final")) || {};

        function initApp() {
            const date = document.getElementById('date-select').value;
            const classe = document.getElementById('classe-select').value;
            const heure = document.getElementById('heure-select').value;
            const sessionID = `${date}_${classe}_${heure}`;
            
            let prevAbs = [];
            const idx = HOURS.indexOf(heure);
            if(idx > 0) {
                const hPrev = HOURS[idx - 1];
                Object.keys(db).forEach(k => { if(k.startsWith(`${date}_${classe}_${hPrev}`)) prevAbs = [...new Set([...prevAbs, ...db[k]])]; });
            }

            renderRegistration(sessionID, prevAbs);
        }

        function renderRegistration(sessionID, prevAbs) {
            const classe = document.getElementById('classe-select').value;
            const container = document.getElementById('student-rows');
            container.innerHTML = "";
            let adminCount = 0;

            DATA[classe].forEach(name => {
                const isAbsNow = db[sessionID]?.includes(name);
                const wasAbsBefore = prevAbs.includes(name);
                if(wasAbsBefore && !isAbsNow) adminCount++;

                container.innerHTML += `
                    <tr class="${isAbsNow ? 'bg-red-50' : (wasAbsBefore ? 'bg-orange-50' : '')}">
                        <td class="p-3 text-right">
                            <div class="font-bold text-xs">${name}</div>
                            ${wasAbsBefore ? '<div class="text-[8px] text-orange-600 font-bold italic">يوجه للإدارة</div>' : ''}
                        </td>
                        <td class="p-3 text-left">
                            <button onclick="toggle('${sessionID}', '${name}')" 
                                class="px-4 py-2 rounded-lg text-[9px] font-bold ${isAbsNow ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-400'}">
                                ${isAbsNow ? 'غائـب' : 'حاضـر'}
                            </button>
                        </td>
                    </tr>`;
            });
            document.getElementById('abs-badge').innerText = (db[sessionID]?.length || 0) + " غائب";
            document.getElementById('admin-alert').style.display = adminCount > 0 ? 'block' : 'none';
        }

        function toggle(sID, name) {
            if(!db[sID]) db[sID] = [];
            if(db[sID].includes(name)) db[sID] = db[sID].filter(n => n !== name);
            else db[sID].push(name);
            localStorage.setItem("hadri_v_final", JSON.stringify(db));
            initApp();
        }

        function renderDailyReport() {
            const date = document.getElementById('date-select').value;
            const content = document.getElementById('display-content');
            document.getElementById('view-title').innerText = "التقرير اليومي المجدول: " + date;
            
            let html = '';
            Object.keys(DATA).forEach(classe => {
                html += `
                    <div class="print-break mb-8">
                        <div class="bg-indigo-900 text-white p-2 text-[11px] font-bold text-center">القسم: ${classe}</div>
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th rowspan="2">اسم التلميذ</th>
                                    <th colspan="4">الفترة الصباحية</th>
                                    <th colspan="4">الفترة المسائية</th>
                                </tr>
                                <tr>${HOURS.map(h => `<th>${h}</th>`).join('')}</tr>
                            </thead>
                            <tbody>`;
                
                DATA[classe].forEach(name => {
                    let hasAbs = false;
                    let row = `<tr><td class="text-right font-bold">${name}</td>`;
                    HOURS.forEach(h => {
                        let isAbs = false;
                        Object.keys(db).forEach(k => { if(k.startsWith(`${date}_${classe}_${h}`) && db[k].includes(name)) isAbs = true; });
                        if(isAbs) { row += `<td class="x-mark">X</td>`; hasAbs = true; } else row += `<td></td>`;
                    });
                    row += `</tr>`;
                    if(hasAbs) html += row;
                });
                html += `</tbody></table></div>`;
            });
            content.innerHTML = html;
        }

        function renderPeriodicReport(days) {
            const content = document.getElementById('display-content');
            const limit = new Date(); limit.setDate(limit.getDate() - days);
            document.getElementById('view-title').innerText = `التقرير ${days === 7 ? 'الأسبوعي' : 'الشهري'} لجميع الأقسام`;

            let html = '';
            Object.keys(DATA).forEach(classe => {
                html += `<div class="bg-slate-800 text-white p-2 text-[10px] font-bold mt-4">القسم: ${classe}</div>
                <table class="report-table"><thead><tr><th>الاسم</th><th>إجمالي الساعات</th><th>الوضعية</th></tr></thead><tbody>`;
                
                let stats = {};
                DATA[classe].forEach(n => stats[n] = 0);
                Object.keys(db).forEach(key => {
                    const [d, cl] = key.split('_');
                    if(cl === classe && new Date(d) >= limit) db[key].forEach(n => { if(stats[n] !== undefined) stats[n]++; });
                });

                Object.entries(stats).sort((a,b) => b[1]-a[1]).forEach(([name, count]) => {
                    if(count > 0) {
                        html += `<tr><td class="text-right font-bold">${name}</td><td>${count} ساعة</td>
                        <td class="${count >= 10 ? 'text-red-600 font-black' : 'text-orange-600'}">${count >= 10 ? 'إنذار 🔴' : 'متابعة 🟠'}</td></tr>`;
                    }
                });
                html += `</tbody></table>`;
            });
            content.innerHTML = html;
        }

        window.onload = () => {
            document.getElementById('date-select').value = new Date().toISOString().split('T')[0];
            initApp();
        };
    </script>
</body>
</html>
